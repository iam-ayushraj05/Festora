[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "migrations",
    ".pytest_cache",
    "db.sqlite3",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "RUF012", # DRF class attributes
    "E501",   # line length handled by black
]

[tool.black]
line-length = 120
target-version = ["py313"]
exclude = '''
/(
    \.git
  | \.pytest_cache
  | migrations
)/
'''
