services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-festora}
      POSTGRES_USER: ${POSTGRES_USER:-festora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-festora_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-festora} -d ${POSTGRES_DB:-festora}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
